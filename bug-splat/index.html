<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUG SPLAT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐛</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Press Start 2P',monospace}
#c{
  display:block;position:fixed;inset:0;
  width:100%;height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
#splat{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:8px 12px;font-size:9px;color:#fff;
  text-shadow:1px 1px 0 #000;z-index:10;pointer-events:none;
}
#hud b{color:#ffd23f}
#overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);text-align:center;padding:20px;z-index:20;
}
#overlay h1{font-size:clamp(1.2rem,5vw,2rem);color:#ff4400;text-shadow:3px 3px 0 #7a1a00;margin-bottom:16px}
#overlay p{font-size:8px;line-height:2.4;color:#ccc;margin-bottom:22px;max-width:380px}
#overlay em{color:#4fe3ff;font-style:normal}
#btn{font:inherit;font-size:11px;padding:12px 24px;background:#ffd23f;color:#000;border:3px solid #000;box-shadow:4px 4px 0 #ff5500;cursor:pointer}
#btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #ff5500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="splat"></canvas>
<div id="hud">
  <span>DIST&nbsp;<b id="hd">0</b>m</span>
  <span>BUG SPLAT</span>
  <span>SPEED&nbsp;<b id="hs">0</b></span>
</div>
<div id="overlay">
  <h1>BUG SPLAT</h1>
  <p>Drive as far as you can.<br>
  Bugs splat your windshield and <em>impair your steering</em>.<br>
  Hit the curb and it&rsquo;s over.<br><br>
  <em>&larr; &rarr; / A D</em> to steer</p>
  <button id="btn">START ENGINE</button>
</div>

<canvas id="splat"></canvas>

<script>
// ── Internal resolution (16:9) ─────────────────────────────────────────────
const GW = 320, GH = 180;
const c   = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
c.width  = GW;
c.height = GH;

const splat   = document.querySelectorAll('#splat')[0];
const sctx    = splat.getContext('2d');

function resize() {
  splat.width  = innerWidth;
  splat.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// ── Road layout ────────────────────────────────────────────────────────────
const RL  = 60;              // road left x
const RR  = 260;             // road right x
const RW  = RR - RL;        // 200 px
const RCX = (RL + RR) / 2;  // 160 — center x

// ── Colors ─────────────────────────────────────────────────────────────────
const GRASS1  = '#2d8c18';
const GRASS2  = '#256612';
const ASPHALT = '#38384a';
const SHOULDER= '#4a4a5c';
const EDGE    = '#e0e0e0';
const CDASH   = '#d4d440';
const TRUNKC  = '#6b3f0e';
const CROWN1  = '#1a6a0a';
const CROWN2  = '#28aa1a';

// ── Game state ─────────────────────────────────────────────────────────────
let scroll = 0;
let speed  = 60;   // px/sec
let dist   = 0;
let elapsed= 0;
let state  = 'title';
let impair = 0;        // 0–1 steering impairment from splats
let driftPh= 0;
let splatCount = 0;

// ── Car ────────────────────────────────────────────────────────────────────
const CW = 14, CH = 22;
let carX  = RCX;
let carY  = GH - 32;
let carVX = 0;

function drawCar(x, y, tilt) {
  const cx = Math.round(x - CW / 2);
  const cy = Math.round(y - CH / 2);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (tilt) ctx.rotate(tilt * 0.08);
  ctx.translate(-Math.round(x), -Math.round(y));

  // body
  ctx.fillStyle = '#cc2200';
  ctx.fillRect(cx, cy + 3, CW, CH - 6);
  // hood
  ctx.fillStyle = '#aa1a00';
  ctx.fillRect(cx + 1, cy, CW - 2, 5);
  // trunk
  ctx.fillStyle = '#aa1a00';
  ctx.fillRect(cx + 1, cy + CH - 5, CW - 2, 5);
  // windshield
  ctx.fillStyle = '#8aaccc';
  ctx.fillRect(cx + 2, cy + 5, CW - 4, 4);
  // rear window
  ctx.fillStyle = '#6a8caa';
  ctx.fillRect(cx + 2, cy + CH - 8, CW - 4, 3);
  // roof
  ctx.fillStyle = '#dd2200';
  ctx.fillRect(cx + 2, cy + 9, CW - 4, 7);
  // wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(cx - 2, cy + 3,  3, 5);
  ctx.fillRect(cx + CW - 1, cy + 3,  3, 5);
  ctx.fillRect(cx - 2, cy + CH - 8, 3, 5);
  ctx.fillRect(cx + CW - 1, cy + CH - 8, 3, 5);
  // headlights
  ctx.fillStyle = '#ffee66';
  ctx.fillRect(cx + 1,     cy - 1, 3, 2);
  ctx.fillRect(cx + CW - 4,cy - 1, 3, 2);
  // tail lights
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(cx + 1,     cy + CH, 3, 2);
  ctx.fillRect(cx + CW - 4,cy + CH, 3, 2);

  ctx.restore();
}

// ── Trees ──────────────────────────────────────────────────────────────────
const trees = [];

function makeTree(y) {
  const left = Math.random() < 0.5;
  const x = left
    ? 2  + Math.random() * (RL - 18)
    : RR + 4 + Math.random() * (GW - RR - 18);
  const s = 7 + Math.floor(Math.random() * 5);
  return { x, y, s, left };
}

function initTrees() {
  trees.length = 0;
  for (let i = 0; i < 16; i++) trees.push(makeTree(Math.random() * (GH + 20) - 10));
}

function updateTrees(dt) {
  for (let i = 0; i < trees.length; i++) {
    trees[i].y += speed * dt;
    if (trees[i].y > GH + 20) {
      trees[i] = makeTree(-20);
    }
  }
}

function drawTree(t) {
  const x = Math.round(t.x), y = Math.round(t.y), s = t.s;
  // trunk
  ctx.fillStyle = TRUNKC;
  ctx.fillRect(x - 2, y, 4, 5);
  // crown (3-layer blocky look)
  ctx.fillStyle = CROWN1;
  ctx.fillRect(x - s,     y - s,         s * 2,     s + 3);
  ctx.fillRect(x - s + 2, y - s - 4,     s * 2 - 4, 5);
  ctx.fillStyle = CROWN2;
  ctx.fillRect(x - s + 3, y - s + 1, s - 2, s - 2);
}

// ── Road drawing ───────────────────────────────────────────────────────────
function drawRoad() {
  // Grass base
  ctx.fillStyle = GRASS1;
  ctx.fillRect(0, 0, GW, GH);

  // Grass texture (vertical stripes)
  ctx.fillStyle = GRASS2;
  for (let x = 0; x < GW; x += 8) {
    if (x + 5 < RL || x > RR) ctx.fillRect(x, 0, 4, GH);
  }

  // Road surface
  ctx.fillStyle = ASPHALT;
  ctx.fillRect(RL, 0, RW, GH);

  // Shoulders (slightly lighter strip inside road edge)
  ctx.fillStyle = SHOULDER;
  ctx.fillRect(RL,       0, 12, GH);
  ctx.fillRect(RR - 12,  0, 12, GH);

  // Edge lines
  ctx.fillStyle = EDGE;
  ctx.fillRect(RL + 12,  0, 2, GH);
  ctx.fillRect(RR - 14,  0, 2, GH);

  // Scrolling center dashes
  const DASH = 14, GAP = 10, PER = DASH + GAP;
  const off = scroll % PER;
  ctx.fillStyle = CDASH;
  for (let y = -DASH + off; y < GH + DASH; y += PER) {
    ctx.fillRect(RCX - 1, Math.round(y), 2, DASH);
  }
}

// ── Splats (on HTML canvas overlay, full screen coords) ────────────────────
function drawSplat(px, py) {
  const r = 24 + Math.random() * 20;
  sctx.save();
  sctx.translate(px, py);
  const gr = sctx.createRadialGradient(0,0,0,0,0,r);
  gr.addColorStop(0,   'rgba(90,210,40,0.98)');
  gr.addColorStop(0.5, 'rgba(55,165,20,0.9)');
  gr.addColorStop(1,   'rgba(20,80,5,0)');
  sctx.fillStyle = gr;
  sctx.beginPath();
  const pts = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < pts; i++) {
    const a  = (i / pts) * Math.PI * 2;
    const rr = r * (0.45 + Math.random() * 0.65);
    i === 0
      ? sctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr)
      : sctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  sctx.closePath();
  sctx.fill();
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 + Math.random()*0.4;
    sctx.strokeStyle = 'rgba(20,110,10,0.75)';
    sctx.lineWidth = 2;
    sctx.beginPath();
    sctx.moveTo(Math.cos(a)*r*0.3, Math.sin(a)*r*0.3);
    sctx.lineTo(Math.cos(a)*r*1.1, Math.sin(a)*r*1.1);
    sctx.stroke();
  }
  sctx.restore();
  splatCount++;
  impair = Math.min(0.88, impair + 0.07);
}

// ── Bugs ───────────────────────────────────────────────────────────────────
const bugs = [];

function spawnBug(diff) {
  // spawn in road bounds, far ahead (small y, near top of screen)
  const x = RL + 14 + Math.random() * (RW - 28);
  bugs.push({
    x, y: -12,
    wx: (Math.random() - 0.5) * 18 * diff,  // wobble x speed px/s
    wph: Math.random() * Math.PI * 2,
    size: 4,
  });
}

let nextBug = 4; // seconds until next bug wave

function updateBugs(dt, diff) {
  nextBug -= dt;
  if (nextBug <= 0) {
    const count = 1 + Math.floor(diff * 0.4);
    for (let i = 0; i < count; i++) spawnBug(diff);
    nextBug = Math.max(1.5, 5 - diff * 0.4);
  }

  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    // bugs move downward (toward player) at a speed relative to road scroll
    b.y += (speed * 0.6 + 30) * dt;
    b.wph += dt * 3;
    b.x  += Math.sin(b.wph) * b.wx * dt;

    // hit check: near car position
    if (b.y > carY - 14 && b.y < carY + 14) {
      if (Math.abs(b.x - carX) < CW * 0.7) {
        // convert game-space hit to screen-space for splat
        const sx = (b.x / GW) * innerWidth;
        const sy = (b.y / GH) * innerHeight * 0.5 + innerHeight * 0.1 + Math.random() * innerHeight * 0.3;
        drawSplat(sx, sy);
        bugs.splice(i, 1);
        continue;
      }
    }
    if (b.y > GH + 10) bugs.splice(i, 1);
  }
}

function drawBug(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  // body
  ctx.fillStyle = '#44cc33';
  ctx.fillRect(x - 3, y - 2, 6, 4);
  // head
  ctx.fillStyle = '#33aa22';
  ctx.fillRect(x - 2, y - 4, 4, 2);
  // eyes
  ctx.fillStyle = '#ff2222';
  ctx.fillRect(x - 2, y - 4, 1, 1);
  ctx.fillRect(x + 1,  y - 4, 1, 1);
  // legs
  ctx.fillStyle = '#228811';
  ctx.fillRect(x - 5, y - 1, 2, 1);
  ctx.fillRect(x - 5, y + 1, 2, 1);
  ctx.fillRect(x + 3,  y - 1, 2, 1);
  ctx.fillRect(x + 3,  y + 1, 2, 1);
}

// ── Input ──────────────────────────────────────────────────────────────────
const keys = {};
let ptrX = null;

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = 1;
  if (state === 'title' || state === 'over') startGame();
  if ([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });
c.addEventListener('pointerdown', e => {
  ptrX = e.clientX;
  if (state === 'title' || state === 'over') startGame();
});
c.addEventListener('pointermove', e => { if (ptrX !== null) ptrX = e.clientX; });
c.addEventListener('pointerup', () => { ptrX = null; });
document.getElementById('btn').onclick = startGame;

// ── Start / reset ──────────────────────────────────────────────────────────
function startGame() {
  if (state === 'playing') return;
  document.getElementById('overlay').style.display = 'none';
  carX = RCX; carVX = 0;
  scroll = 0; speed = 60; dist = 0; elapsed = 0;
  impair = 0; driftPh = 0; splatCount = 0; nextBug = 4;
  bugs.length = 0;
  sctx.clearRect(0, 0, splat.width, splat.height);
  initTrees();
  state = 'playing';
  lastT = performance.now();
}

function gameOver() {
  state = 'over';
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent  = 'SPLATTERED';
  ov.querySelector('p').innerHTML     = `You drove <em>${Math.floor(dist / 10)}m</em><br>Splats: <em>${splatCount}</em>`;
  document.getElementById('btn').textContent = 'TRY AGAIN';
  ov.style.display = 'flex';
}

// ── Main loop ──────────────────────────────────────────────────────────────
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1/30, (now - lastT) / 1000);
  lastT = now;

  if (state === 'playing') {
    elapsed += dt;
    const diff = 1 + elapsed / 30;

    speed   = Math.min(240, speed + 10 * dt);
    scroll += speed * dt;
    dist   += speed * dt;

    // steering
    let ax = 0;
    if (keys['arrowleft']  || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    if (ptrX !== null) ax = Math.max(-1, Math.min(1, (ptrX - innerWidth * 0.5) / (innerWidth * 0.28)));

    // impairment drift
    driftPh += dt * 1.8;
    const drift = Math.sin(driftPh) * impair * 4;

    carVX += (ax * 180 + drift) * dt;
    carVX *= Math.pow(0.08, dt);
    carX  += carVX * dt;

    // road bounds
    const minX = RL + CW / 2 + 2;
    const maxX = RR - CW / 2 - 2;
    if (carX < minX || carX > maxX) { gameOver(); return; }

    updateTrees(dt);
    updateBugs(dt, diff);
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  drawRoad();

  // trees behind car (sort so lower y = draws first = further away)
  trees.sort((a, b) => a.y - b.y);
  trees.forEach(drawTree);

  // bugs
  bugs.forEach(drawBug);

  if (state === 'playing' || state === 'over') {
    drawCar(carX, carY, carVX);
  }

  // HUD
  document.getElementById('hd').textContent = Math.floor(dist / 10);
  document.getElementById('hs').textContent = Math.floor(speed);
}

initTrees();
requestAnimationFrame(frame);
</script>
</body>
</html>
