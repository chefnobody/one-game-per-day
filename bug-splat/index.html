<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUG SPLAT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐛</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace}
#game{
  position:fixed;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
#splat{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud{
  position:fixed;top:0;left:0;right:0;
  padding:10px 14px;display:flex;justify-content:space-between;
  font-size:9px;color:#fff;text-shadow:1px 1px 0 #000;
  z-index:10;pointer-events:none;
}
#hud b{color:#ffd23f}
#overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.87);text-align:center;padding:24px;z-index:20;
}
#overlay h1{font-size:clamp(1.4rem,5vw,2.4rem);color:#ff5500;text-shadow:3px 3px 0 #7a1a00;margin-bottom:18px}
#overlay p{font-size:9px;line-height:2.4;color:#ccc;margin-bottom:26px;max-width:400px}
#overlay em{color:#4fe3ff;font-style:normal}
#btn{font:inherit;font-size:12px;padding:14px 28px;background:#ffd23f;color:#000;border:3px solid #000;box-shadow:4px 4px 0 #ff5500;cursor:pointer}
#btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #ff5500}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="splat"></canvas>
<div id="hud">
  <div>DIST&nbsp;<b id="hd">0</b>m</div>
  <div>SPEED&nbsp;<b id="hs">0</b></div>
  <div>SPLATS&nbsp;<b id="hsp">0</b></div>
</div>
<div id="overlay">
  <h1>BUG SPLAT</h1>
  <p>Drive as far as you can.<br>
  Bugs splat your windshield<br>and <em>impair your steering</em>.<br>
  Hit the curb and it&rsquo;s over.<br><br>
  <em>&larr; &rarr; / A D</em> to steer</p>
  <button id="btn">START ENGINE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── renderer (pixelated: render low-res, scale up via CSS) ─────────────────
const gc = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas: gc, antialias: false});
renderer.setPixelRatio(1);

const sc = document.getElementById('splat');
const ctx = sc.getContext('2d');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2a);
scene.fog = new THREE.Fog(0x1a1a2a, 40, 90);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 150);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(Math.floor(w * 0.35), Math.floor(h * 0.35), false);
  gc.style.width  = w + 'px';
  gc.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sc.width = w; sc.height = h;
}
addEventListener('resize', resize);

// ── lights ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(2, 10, 4);
scene.add(sun);

// ── road ───────────────────────────────────────────────────────────────────
const ROAD_W  = 7.5;
const SEG_LEN = 10;
const NSEGS   = 18;

const matRoad  = new THREE.MeshLambertMaterial({color: 0x2b2b38});
const matGrass = new THREE.MeshLambertMaterial({color: 0x1d5c0f});
const matKerb  = new THREE.MeshLambertMaterial({color: 0xddddbb});
const matDash  = new THREE.MeshLambertMaterial({color: 0xe8e860});

const tiles = [];
function makeTile(z) {
  const g = new THREE.Group();
  g.position.z = z;

  const grass = new THREE.Mesh(new THREE.PlaneGeometry(100, SEG_LEN), matGrass);
  grass.rotation.x = -Math.PI/2;
  g.add(grass);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, SEG_LEN), matRoad);
  road.rotation.x = -Math.PI/2;
  road.position.y = 0.01;
  g.add(road);

  [-1,1].forEach(s => {
    const k = new THREE.Mesh(new THREE.PlaneGeometry(0.5, SEG_LEN), matKerb);
    k.rotation.x = -Math.PI/2;
    k.position.set(s*(ROAD_W/2+0.25), 0.02, 0);
    g.add(k);
  });

  if(Math.round(Math.abs(z)/SEG_LEN) % 2 === 0){
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, SEG_LEN*0.55), matDash);
    dash.rotation.x = -Math.PI/2;
    dash.position.y = 0.03;
    g.add(dash);
  }

  scene.add(g);
  return g;
}
for(let i=0; i<NSEGS; i++) tiles.push(makeTile(-i * SEG_LEN));

// ── player car (top-down boxy look) ────────────────────────────────────────
const car = new THREE.Group();
scene.add(car);

const matCarBody = new THREE.MeshLambertMaterial({color: 0xff2200});
const matCarRoof = new THREE.MeshLambertMaterial({color: 0xcc1a00});
const matGlass   = new THREE.MeshLambertMaterial({color: 0x88ccff, transparent:true, opacity:0.8});
const matWheel   = new THREE.MeshLambertMaterial({color: 0x111111});
const matLight   = new THREE.MeshLambertMaterial({color: 0xffff88});

// body slab
const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.28, 2.8), matCarBody);
carBody.position.y = 0.22;
car.add(carBody);
// roof
const carRoof = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 1.4), matCarRoof);
carRoof.position.set(0, 0.47, -0.1);
car.add(carRoof);
// windshield (front)
const ws = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.18, 0.08), matGlass);
ws.position.set(0, 0.46, 0.65);
car.add(ws);
// rear window
const rw = ws.clone();
rw.position.z = -0.85;
car.add(rw);
// wheels
[[0.88,0,1.0],[-0.88,0,1.0],[0.88,0,-1.0],[-0.88,0,-1.0]].forEach(([x,y,z])=>{
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.22,0.55), matWheel);
  w.position.set(x, y+0.14, z);
  car.add(w);
});
// headlights
[[0.46,0,1.42],[-0.46,0,1.42]].forEach(([x,y,z])=>{
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.1,0.08), matLight);
  h.position.set(x, y+0.28, z);
  car.add(h);
});

// ── obstacles (oncoming cars) ───────────────────────────────────────────────
const obsColors = [0x0044ff, 0x888800, 0x009966, 0x880055, 0x666688];
const obs = [];

function spawnObs() {
  const side  = Math.random() < 0.5 ? -1 : 1;
  const laneX = side * (Math.random()*1.5 + 0.5);
  const color = obsColors[Math.floor(Math.random()*obsColors.length)];
  const mesh  = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.28,2.6),
                               new THREE.MeshLambertMaterial({color}));
  mesh.position.set(laneX, 0.22, car.position.z - 80);
  scene.add(mesh);
  obs.push({mesh, laneX});
}

// ── bugs ───────────────────────────────────────────────────────────────────
const bugs = [];

function makeBugMesh() {
  const g = new THREE.Group();
  const bmat = new THREE.MeshLambertMaterial({color:0x33bb33});
  const emat = new THREE.MeshLambertMaterial({color:0xff2222});
  const lmat = new THREE.MeshLambertMaterial({color:0x228822});
  // abdomen
  const ab = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.3), bmat);
  g.add(ab);
  // head
  const hd = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.1,0.14), bmat);
  hd.position.z = 0.2;
  g.add(hd);
  // eyes
  [-1,1].forEach(s=>{
    const e = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.06,0.05), emat);
    e.position.set(s*0.05, 0.08, 0.24);
    g.add(e);
  });
  // legs 3 per side
  [-1,1].forEach(s=>{
    for(let i=0;i<3;i++){
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.03,0.04), lmat);
      l.position.set(s*0.18, 0, -0.08 + i*0.1);
      g.add(l);
    }
  });
  return g;
}

function spawnBug(zAhead, diff) {
  const x = (Math.random()-0.5)*(ROAD_W-1.2);
  const mesh = makeBugMesh();
  const y = 0.5 + Math.random()*0.6;
  mesh.position.set(x, y, zAhead);
  mesh.rotation.y = Math.random()*Math.PI*2;
  scene.add(mesh);
  bugs.push({
    mesh, x, z: zAhead,
    drift: (Math.random()-0.5)*0.012*diff,
    spin:  (Math.random()-0.5)*6
  });
}

// ── splats ─────────────────────────────────────────────────────────────────
let splatCount = 0;
let impair = 0;

function drawSplat(px, py) {
  const r = 20 + Math.random()*22;
  ctx.save();
  ctx.translate(px, py);

  const gr = ctx.createRadialGradient(0,0,0,0,0,r);
  gr.addColorStop(0,   'rgba(90,210,40,0.98)');
  gr.addColorStop(0.55,'rgba(55,165,20,0.9)');
  gr.addColorStop(1,   'rgba(20,80,5,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  const pts = 8+Math.floor(Math.random()*5);
  for(let i=0;i<pts;i++){
    const a = (i/pts)*Math.PI*2;
    const rr = r*(0.45+Math.random()*0.65);
    i===0 ? ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr)
           : ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fill();

  for(let i=0;i<6;i++){
    const a = (i/6)*Math.PI*2 + Math.random()*0.4;
    ctx.strokeStyle = 'rgba(20,110,10,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.3, Math.sin(a)*r*0.3);
    ctx.lineTo(Math.cos(a)*r*1.15, Math.sin(a)*r*1.15);
    ctx.stroke();
  }

  [-0.28,0.28].forEach(ox=>{
    ctx.fillStyle='rgba(255,20,20,0.9)';
    ctx.beginPath();
    ctx.arc(ox*r, -0.15*r, r*0.09, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
  splatCount++;
  impair = Math.min(0.88, impair + 0.07);
}

// ── game state ─────────────────────────────────────────────────────────────
let state='title', carX=0, carVX=0, speed=0, dist=0, elapsed=0;
let driftPhase=0, nextObs=50, nextBug=15;
const keys={};
let ptrX=null;

addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=1;
  if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if(state==='title') startGame();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=0; });
gc.addEventListener('pointerdown', e=>{ ptrX=e.clientX; if(state==='title') startGame(); });
gc.addEventListener('pointermove', e=>{ if(ptrX!==null) ptrX=e.clientX; });
gc.addEventListener('pointerup',   ()=>{ ptrX=null; });
document.getElementById('btn').onclick = startGame;

function startGame() {
  if(state==='playing') return;
  document.getElementById('overlay').style.display='none';
  carX=0; carVX=0; speed=0; dist=0; elapsed=0;
  impair=0; splatCount=0; driftPhase=0; nextObs=50; nextBug=15;
  ctx.clearRect(0,0,sc.width,sc.height);
  obs.forEach(o=>scene.remove(o.mesh));  obs.length=0;
  bugs.forEach(b=>scene.remove(b.mesh)); bugs.length=0;
  car.position.set(0,0,0);
  state='playing';
  lastT=performance.now();
}

function gameOver() {
  state='over';
  const ov=document.getElementById('overlay');
  ov.querySelector('h1').textContent='SPLATTERED';
  ov.querySelector('p').innerHTML=`You drove <em>${Math.floor(dist)}m</em><br>Splats: <em>${splatCount}</em>`;
  document.getElementById('btn').textContent='TRY AGAIN';
  ov.style.display='flex';
}

// ── main loop ──────────────────────────────────────────────────────────────
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05,(now-lastT)/1000);
  lastT=now;

  if(state!=='playing'){ renderer.render(scene,camera); return; }

  elapsed += dt;
  const diff = 1 + elapsed/28;

  // speed
  speed = Math.min(30, speed + 5*dt);
  dist  += speed*dt;

  // steering input
  let si = 0;
  if(keys['arrowleft']  || keys['a']) si -= 1;
  if(keys['arrowright'] || keys['d']) si += 1;
  if(ptrX !== null) si = Math.max(-1, Math.min(1, (ptrX - innerWidth*0.5) / (innerWidth*0.28)));

  // impairment drift
  driftPhase += dt * 1.6;
  const drift = Math.sin(driftPhase) * impair * 3.8;

  carVX += (si*9 + drift)*dt;
  carVX *= Math.pow(0.04, dt);
  carX  += carVX * dt * speed * 0.062;

  // road limits
  const halfW = ROAD_W/2 - 0.85;
  if(Math.abs(carX) >= halfW){ gameOver(); return; }

  car.position.x = carX;
  car.rotation.y = -carVX * 0.065;

  // drive forward (move world toward camera)
  const dz = speed * dt;
  car.position.z -= dz;

  // recycle tiles
  tiles.forEach(t=>{
    if(t.position.z - car.position.z > SEG_LEN*2)
      t.position.z -= NSEGS * SEG_LEN;
  });

  // obstacle update
  for(let i=obs.length-1; i>=0; i--){
    const o = obs[i];
    const rz = o.mesh.position.z - car.position.z;
    if(Math.abs(rz) < 1.6 && Math.abs(carX - o.mesh.position.x) < 1.3){
      gameOver(); return;
    }
    if(rz > 12){ scene.remove(o.mesh); obs.splice(i,1); }
  }
  if(dist > nextObs){
    spawnObs();
    nextObs = dist + 22 + Math.random()*28/diff;
  }

  // bug update
  for(let i=bugs.length-1; i>=0; i--){
    const b = bugs[i];
    b.mesh.position.x += b.drift;
    b.mesh.rotation.y += b.spin * dt;
    const rz = b.mesh.position.z - car.position.z;

    if(rz > -1.8 && rz < 0.6){
      if(Math.abs(carX - b.mesh.position.x) < 0.9){
        const spx = innerWidth  * (0.5 + (b.mesh.position.x - carX)/ROAD_W*0.65);
        const spy = innerHeight * (0.28 + Math.random()*0.38);
        drawSplat(spx, spy);
        scene.remove(b.mesh); bugs.splice(i,1);
        continue;
      }
    }
    if(rz > 10){ scene.remove(b.mesh); bugs.splice(i,1); }
  }
  if(dist > nextBug){
    const count = 1 + Math.floor(diff * 0.45);
    for(let i=0;i<count;i++) spawnBug(car.position.z - 60 - i*5, diff);
    nextBug = dist + Math.max(3, 11 - diff*0.9);
  }

  // top-down camera with slight forward tilt (Spy Hunter style)
  camera.position.set(carX*0.35, 18, car.position.z + 4);
  camera.lookAt(carX*0.15, 0, car.position.z - 12);

  document.getElementById('hd').textContent  = Math.floor(dist);
  document.getElementById('hs').textContent  = Math.floor(speed);
  document.getElementById('hsp').textContent = splatCount;

  renderer.render(scene, camera);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
