<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Game Per Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0c0e;
      color: #e8e8e8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 4rem 2rem 6rem;
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 3.5rem;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      font-weight: 300;
      color: #555;
      letter-spacing: 0.01em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      display: block;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
      background: #141416;
      border: 1px solid #1e1e22;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      border-color: #333338;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      animation: wobble 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes wobble {
      0%   { transform: rotate(0deg) scale(1); }
      15%  { transform: rotate(-1.5deg) scale(1.03); }
      30%  { transform: rotate(1.2deg) scale(1.03); }
      45%  { transform: rotate(-0.8deg) scale(1.02); }
      60%  { transform: rotate(0.4deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .card-img-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0a0a0c;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.3s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.03);
      filter: brightness(1.06);
    }

    .card-img-wrap .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .pills {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .pill-name {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .pill-date {
      background: rgba(0, 0, 0, 0.5);
      color: #888;
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-weight: 300;
    }
  </style>
</head>
<body>
  <header>
    <h1>One Game Per Day</h1>
    <p class="subtitle">a small experiment in daily game-making</p>
  </header>

  <main class="grid">

    <a href="./ball-balance/" class="card">
      <div class="card-img-wrap">
        <img src="./ball-balance/screenshot.png" alt="Tilt*bert">
        <div class="pills">
          <span class="pill pill-name">Tilt*bert</span>
          <span class="pill pill-date">Nov 6, 2026</span>
        </div>
      </div>
    </a>

    <a href="./bug-splat/" class="card">
      <div class="card-img-wrap" style="background: linear-gradient(160deg,#0d1a0d 0%,#060e06 60%,#0d0d1a 100%);">
        <div class="placeholder">🐛</div>
        <div class="pills">
          <span class="pill pill-name">Bug Splat</span>
          <span class="pill pill-date">Nov 6, 2026</span>
        </div>
      </div>
    </a>

  </main>
</body>
</html>
