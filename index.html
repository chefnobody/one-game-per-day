<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Game Per Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      padding: 3.5rem 2rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 4vw, 1.8rem);
      color: #ff7a1a;
      text-shadow: 3px 3px 0 #7a2b00;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.75rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      display: block;
      text-decoration: none;
      border-radius: 14px;
      overflow: hidden;
      background: #161616;
      border: 1px solid #242424;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      animation: wobble 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      box-shadow: 0 10px 40px rgba(255, 122, 26, 0.25);
    }

    @keyframes wobble {
      0%   { transform: rotate(0deg) scale(1); }
      12%  { transform: rotate(-2.5deg) scale(1.04); }
      28%  { transform: rotate(2deg) scale(1.04); }
      44%  { transform: rotate(-1.2deg) scale(1.03); }
      60%  { transform: rotate(0.7deg) scale(1.02); }
      76%  { transform: rotate(-0.3deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .card-img-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }

    .card-img-wrap .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease;
    }

    .card:hover .card-img-wrap img {
      filter: brightness(1.08);
    }

    .pills {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      padding: 5px 11px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    .pill-name {
      background: rgba(255, 110, 20, 0.88);
      color: #fff;
      text-transform: uppercase;
      font-weight: bold;
    }

    .pill-date {
      background: rgba(10, 10, 20, 0.75);
      color: #4fe3ff;
      border: 1px solid rgba(79, 227, 255, 0.25);
    }
  </style>
</head>
<body>
  <header>
    <h1>ONE GAME PER DAY</h1>
    <p class="subtitle">a small experiment in daily game-making</p>
  </header>

  <main class="grid">

    <a href="./ball-balance/" class="card">
      <div class="card-img-wrap">
        <img src="./ball-balance/screenshot.png" alt="TILT*BERT">
        <div class="pills">
          <span class="pill pill-name">TILT*BERT</span>
          <span class="pill pill-date">Nov 6, 2026</span>
        </div>
      </div>
    </a>

    <a href="./bug-splat/" class="card">
      <div class="card-img-wrap" style="background: linear-gradient(160deg,#1a2a1a 0%,#0a1a0a 60%,#1a1a2a 100%);">
        <div class="placeholder">🐛</div>
        <div class="pills">
          <span class="pill pill-name">BUG SPLAT</span>
          <span class="pill pill-date">Nov 6, 2026</span>
        </div>
      </div>
    </a>

  </main>
</body>
</html>
