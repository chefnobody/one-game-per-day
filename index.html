<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Game Per Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080809;
      color: #e8e8e8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .site-header {
      padding: 2.2rem 2.4rem 1.8rem;
      border-bottom: 1px solid #141416;
    }
    .site-header h1 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }
    .site-header p {
      font-size: 0.72rem;
      font-weight: 300;
      color: #444;
      margin-top: 0.25rem;
      letter-spacing: 0.04em;
    }

    /* ── Strip ── */
    .strip {
      display: flex;
      flex-wrap: wrap;
    }

    .card {
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      /* each card is square; 3 per row on large screens */
      flex: 1 1 33.333%;
      min-width: 260px;
      aspect-ratio: 1 / 1;
      background: #0c0c0e;
    }

    /* right border between cards, bottom border on each row */
    .card:not(:last-child) { border-right: 1px solid #141416; }
    .card { border-bottom: 1px solid #141416; }

    .card svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  filter 0.3s ease;
    }
    .card:hover svg {
      transform: scale(1.03);
      filter: brightness(1.08);
    }

    /* ── Pills ── */
    .pills {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .pill-name {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
    }
    .pill-date {
      background: rgba(0,0,0,0.55);
      color: #777;
      border: 1px solid rgba(255,255,255,0.07);
      font-weight: 300;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>One Game Per Day</h1>
    <p>a small experiment in daily game-making</p>
  </header>

  <main class="strip">

    <!-- ── Tilt*bert ── -->

        <!-- (col=2,row=3) center=(174,245) -->

        <polygon points="174,259 200,245 200,254 174,268" fill="#1e0f5a" stroke="#12094a" stroke-width="0.8"/>
        <polygon points="148,245 174,259 174,268 148,254" fill="#2a1266" stroke="#12094a" stroke-width="0.8"/>
        <!-- (col=3,row=3) center=(200,259) -->
        <polygon points="200,245 226,259 200,273 174,259" fill="#3a1f9c" stroke="#12094a" stroke-width="0.8"/>
        <polygon points="200,273 226,259 226,268 200,282" fill="#1e0f5a" stroke="#12094a" stroke-width="0.8"/>
        <polygon points="174,259 200,273 200,282 174,268" fill="#2a1266" stroke="#12094a" stroke-width="0.8"/>
        <!-- (col=4,row=3) center=(226,273) -->
        <polygon points="226,259 252,273 226,287 200,273" fill="#3a1f9c" stroke="#12094a" stroke-width="0.8"/>
        <polygon points="226,287 252,273 252,282 226,296" fill="#1e0f5a" stroke="#12094a" stroke-width="0.8"/>
        <polygon points="200,273 226,287 226,296 200,282" fill="#2a1266" stroke="#12094a" stroke-width="0.8"/>

        <!-- Ball shadow on lit tile (col=1,row=1) -->
        <ellipse cx="200" cy="206" rx="20" ry="9" fill="#000" opacity="0.45"/>
        <!-- Ball -->
        <circle cx="200" cy="190" r="23" fill="url(#ball1)"/>

        <!-- Rain streaks -->

        <span class="pill pill-date">Nov 6, 2026</span>
      </div>
    </a>

    <!-- ── Q*HOPPER ── -->

            <stop offset="55%" stop-color="#ff8800"/>
            <stop offset="100%" stop-color="#b83300"/>
          </radialGradient>
        </defs>
        <rect width="400" height="400" fill="url(#bg2)"/>

        <!-- Stars -->
        <circle cx="50"  cy="28"  r="1.2" fill="#fff" opacity="0.5"/>
        <circle cx="338" cy="44"  r="1"   fill="#fff" opacity="0.4"/>
        <circle cx="366" cy="18"  r="0.8" fill="#fff" opacity="0.4"/>
        <circle cx="30"  cy="336" r="1"   fill="#fff" opacity="0.3"/>
        <circle cx="358" cy="358" r="1.2" fill="#fff" opacity="0.3"/>
        <circle cx="80"  cy="340" r="0.8" fill="#fff" opacity="0.3"/>
