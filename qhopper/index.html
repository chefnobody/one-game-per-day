<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q*HOPPER</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0028;
      overflow: hidden;
      width: 100vw; height: 100vh;
      font-family: 'Press Start 2P', monospace;
    }
    canvas { display: block; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 16px 20px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 10px;
      color: #fff;
      line-height: 1.8;
    }
    .hud-label { color: #888; font-size: 8px; }
    .hud-val { color: #fff; font-size: 11px; }
    #lives-icons { display: flex; gap: 6px; margin-top: 4px; }
    .life-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #ff8800;
      box-shadow: 0 0 6px #ff8800;
    }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(13,0,40,0.92);
      z-index: 20;
      text-align: center;
      padding: 2rem;
    }
    #overlay h1 {
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      color: #ff8800;
      text-shadow: 0 0 20px #ff8800aa;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    #overlay .sub {
      font-size: clamp(0.5rem, 2vw, 0.75rem);
      color: #aaa;
      line-height: 2.2;
      margin-bottom: 2rem;
    }
    #overlay .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.6rem, 2vw, 0.9rem);
      background: #ff8800;
      color: #000;
      border: none;
      padding: 14px 32px;
      border-radius: 6px;
      cursor: pointer;
      pointer-events: all;
      letter-spacing: 0.08em;
      transition: background 0.15s, transform 0.1s;
    }
    #overlay .btn:hover { background: #ffaa33; transform: scale(1.04); }
    #overlay.hidden { display: none; }

    #swear {
      position: fixed;
      font-size: clamp(0.55rem, 2vw, 0.85rem);
      color: #fff;
      background: rgba(0,0,0,0.75);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 6px 10px;
      pointer-events: none;
      z-index: 15;
      display: none;
      white-space: nowrap;
      text-shadow: 0 0 8px #ff4444;
    }

    .keys-hint {
      font-size: 0.55rem;
      color: #555;
      margin-top: 1.5rem;
      line-height: 2.2;
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE</div>
    <div class="hud-val" id="hud-score">0</div>
  </div>
  <div class="hud-box" style="text-align:center;">
    <div class="hud-label">LEVEL</div>
    <div class="hud-val" id="hud-level">1</div>
  </div>
  <div class="hud-box" style="text-align:right;">
    <div class="hud-label">LIVES</div>
    <div id="lives-icons"></div>
  </div>
</div>

<div id="swear">@!#?@!</div>

<div id="overlay">
  <h1>Q*HOPPER</h1>
  <p class="sub">
    HOP ALL CUBES TO CHANGE THEIR COLOR<br>
    AVOID RED DANGER CUBES &amp; ENEMIES<br>
    USE ARROW KEYS OR WASD TO HOP
  </p>
  <button class="btn" id="start-btn">START GAME</button>
  <div class="keys-hint">
    ↖ A/← &nbsp; ↗ W/↑ &nbsp; ↙ S/↓ &nbsp; ↘ D/→
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const ROWS = 7;
const CS = 2.2;       // cube face size
const CUBE_H = 1.1;   // cube height (flatter for classic Q*bert look)
const STEP = 2.6;     // grid spacing
const HOP_DURATION = 220; // ms
const HOP_HEIGHT = 3.2;
const ENEMY_HOP_MS = 950;
const CAMSIZE = 13;   // orthographic half-height

// Q*bert hop directions: [dcol, drow]
const DIRS = {
  ul: [-1, -1],
  ur: [ 0, -1],
  ll: [ 0,  1],
  lr: [ 1,  1],
};

// Palettes: 6-face colors [+x,-x,+y,-y,+z,-z]; hidden faces = 0
// Visible from camera at (50,50,50): +x (right), +y (top), +z (front)
const PALS = [
  { unlit:[0x3a1f9c,0,0x5533cc,0,0x1e0f5a,0], lit:[0xb06800,0,0xf0a020,0,0x704000,0], bg:0x0d0028 },
  { unlit:[0x0d3d1e,0,0x1a6632,0,0x06200f,0], lit:[0xaa1133,0,0xff4466,0,0x770011,0], bg:0x000e06 },
  { unlit:[0x002a40,0,0x004466,0,0x001525,0], lit:[0x008899,0,0x22ddff,0,0x005566,0], bg:0x000a14 },
  { unlit:[0x3d1500,0,0x662200,0,0x200900,0], lit:[0x3a8800,0,0x66ee22,0,0x204400,0], bg:0x100500 },
];
const DANGER_COLS = [0x881100, 0, 0xdd2200, 0, 0x550000, 0];

// ─── Three.js Init ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0028);

const camera = new THREE.OrthographicCamera(-CAMSIZE, CAMSIZE, CAMSIZE, -CAMSIZE, 0.1, 500);
camera.position.set(60, 60, 60);
camera.lookAt(0, 0, 0);

function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h);
  camera.left  = -CAMSIZE * asp;
  camera.right =  CAMSIZE * asp;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// Lighting — match Tilt*bert exactly
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(2, 4, 3);
scene.add(sun);

// ─── Grid Utils ──────────────────────────────────────────────────────────────
function isValid(col, row) {
  return row >= 0 && row < ROWS && col >= 0 && col <= row;
}

// Map grid (col,row) → 3D world position (center of cube).
// Camera right vector from (60,60,60) is (1,0,-1)/√2, so screen_x = (x-z)/√2.
// For ul (Δcol=-1,Δrow=-1) to go LEFT: need Δx<Δz → x=col*STEP, z=(row-col)*STEP.
// y = -row * CUBE_H gives the 3D staircase depth.
function gridToWorld(col, row) {
  const OFS = (ROWS - 1) / 3 * STEP;
  return new THREE.Vector3(
    col * STEP - OFS,
    -row * CUBE_H,
    (row - col) * STEP - OFS
  );
}

// ─── BFS Reachability (guarantees no dead tiles) ──────────────────────────────
function isCompletable(cubeData) {
  const startKey = '0,0';
  if (!cubeData.has(startKey) || cubeData.get(startKey).danger) return false;
  const visited = new Set([startKey]);
  const queue = [[0, 0]];
  while (queue.length) {
    const [c, r] = queue.shift();
    for (const [dc, dr] of Object.values(DIRS)) {
      const nc = c + dc, nr = r + dr;
      if (!isValid(nc, nr)) continue;
      const key = `${nc},${nr}`;
      if (visited.has(key)) continue;
      const cube = cubeData.get(key);
      if (!cube || cube.danger) continue;
      visited.add(key);
      queue.push([nc, nr]);
    }
  }
  for (const [key, cube] of cubeData) {
    if (!cube.danger && !visited.has(key)) return false;
  }
  return true;
}

// ─── Material Helpers ────────────────────────────────────────────────────────
function makeMats(cols) {
  return cols.map(c => new THREE.MeshLambertMaterial({ color: c || 0x000000 }));
}

// ─── Game State ──────────────────────────────────────────────────────────────
let score = 0, lives = 3, level = 0, gameActive = false;

let cubeMap = new Map();   // `col,row` → { mesh, danger, lit, col, row }
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

let qbertGroup = null, qbertBody = null, qbertNoseGroup = null;
let qCol = 0, qRow = 0;
let hopPhase = null; // { fromV, toV, startTime, duration, toCol, toRow, danger }
let squashT = 1;
let dying = false;
let qbertGraceUntil = 0; // ms timestamp — invincible until this time

let enemies = [];
const enemyGroup = new THREE.Group();
scene.add(enemyGroup);

let dangerMats = [];
let dangerClock = 0;
let litCount = 0, totalNonDanger = 0;
let currentUnlitMats = [], currentLitMats = [];

// ─── Build Pyramid ───────────────────────────────────────────────────────────
const cubeGeo = new THREE.BoxGeometry(CS, CUBE_H, CS);

function buildPyramid(palIdx) {
  cubeGroup.clear();
  cubeMap.clear();

  const pal = PALS[palIdx];
  scene.background.set(pal.bg);

  currentUnlitMats = makeMats(pal.unlit);
  currentLitMats   = makeMats(pal.lit);
  dangerMats       = pal.danger_mats || makeMats(DANGER_COLS);
  // Store on pal so we reuse the same emissive material instance for pulsing
  if (!pal.danger_mats) {
    dangerMats[2].emissive = new THREE.Color(0x550000);
    pal.danger_mats = dangerMats;
  }

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col <= row; col++) {
      const key = `${col},${row}`;
      const wp = gridToWorld(col, row);
      const mesh = new THREE.Mesh(cubeGeo, currentUnlitMats.map(m => m.clone()));
      mesh.position.set(wp.x, wp.y, wp.z);
      cubeGroup.add(mesh);
      cubeMap.set(key, { mesh, danger: false, lit: false, col, row });
    }
  }
}

// ─── Danger Placement (BFS-safe) ─────────────────────────────────────────────
function placeDanger(targetCount) {
  const keys = [...cubeMap.keys()].filter(k => k !== '0,0');
  for (let i = keys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  let added = 0;
  for (const key of keys) {
    if (added >= targetCount) break;
    cubeMap.get(key).danger = true;
    if (!isCompletable(cubeMap)) {
      cubeMap.get(key).danger = false;
    } else {
      added++;
    }
  }
  for (const [, cube] of cubeMap) {
    if (cube.danger) {
      cube.mesh.material = dangerMats.map(m => m.clone ? m.clone() : m);
      // Share the same emissive top material for synchronized pulsing
      cube.mesh.material[2] = dangerMats[2];
    }
  }
}

// ─── Q*bert Character ────────────────────────────────────────────────────────
function buildQbert() {
  if (qbertGroup) scene.remove(qbertGroup);
  qbertGroup = new THREE.Group();

  const bodyGeo = new THREE.SphereGeometry(0.52, 20, 14);
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff8800 });
  qbertBody = new THREE.Mesh(bodyGeo, bodyMat);
  qbertBody.position.y = 0.52;
  qbertGroup.add(qbertBody);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.13, 8, 8);
  const whiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

  [-0.19, 0.19].forEach(ox => {
    const white = new THREE.Mesh(eyeGeo, whiteMat);
    white.position.set(ox, 0.75, 0.42);
    qbertGroup.add(white);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), blackMat);
    pup.position.set(ox, 0.75, 0.53);
    qbertGroup.add(pup);
  });

  // Nose group (rotates with direction)
  qbertNoseGroup = new THREE.Group();
  qbertNoseGroup.position.y = 0.52;
  const noseGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.5, 8);
  const noseMat = new THREE.MeshLambertMaterial({ color: 0xff5533 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 0.6;
  qbertNoseGroup.add(nose);
  qbertGroup.add(qbertNoseGroup);

  // Spindly bird legs
  const legMat = new THREE.MeshLambertMaterial({ color: 0xcc4400 });
  function legSeg(ax, ay, az, bx, by, bz, r) {
    const a = new THREE.Vector3(ax, ay, az);
    const b = new THREE.Vector3(bx, by, bz);
    const dir = b.clone().sub(a);
    const len = dir.length();
    const geo = new THREE.CylinderGeometry(r, r, len, 6);
    const m = new THREE.Mesh(geo, legMat);
    m.position.copy(a).addScaledVector(dir.normalize(), len * 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    qbertGroup.add(m);
  }
  [-1, 1].forEach(s => {
    // Upper leg: hip outward and down
    legSeg(s * 0.17, 0.02, 0,   s * 0.30, -0.26, 0,    0.055);
    // Lower leg: knee inward and down (classic bird "backwards knee")
    legSeg(s * 0.30, -0.26, 0,  s * 0.14, -0.52, 0.06, 0.045);
    // Foot: horizontal stub forward
    legSeg(s * 0.14, -0.52, 0.06,  s * 0.14, -0.52, 0.22, 0.038);
    // Back spur
    legSeg(s * 0.14, -0.52, 0.06,  s * 0.10, -0.52, -0.08, 0.030);
  });

  // Drop shadow
  const shadowGeo = new THREE.CircleGeometry(0.42, 16);
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false
  });
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -CUBE_H * 0.5 + 0.02;
  qbertGroup.add(shadow);

  scene.add(qbertGroup);
}

// Nose rotation per hop direction: x=col*STEP, z=(row-col)*STEP axes
// ul(Δcol-1,Δrow-1)→Δx=-STEP,Δz=0→nose faces -X→y=-PI/2
// ur(Δcol0,Δrow-1)→Δx=0,Δz=-STEP→nose faces -Z→y=PI
// ll(Δcol0,Δrow+1)→Δx=0,Δz=+STEP→nose faces +Z→y=0
// lr(Δcol+1,Δrow+1)→Δx=+STEP,Δz=0→nose faces +X→y=PI/2
const DIR_ROT = { ul: -Math.PI / 2, ur: Math.PI, ll: 0, lr: Math.PI / 2 };

function setQbertAtTile(col, row) {
  const wp = gridToWorld(col, row);
  qbertGroup.position.set(wp.x, wp.y + CUBE_H * 0.5, wp.z);
  qbertGroup.scale.set(1, 1, 1);
}

// ─── Enemies ─────────────────────────────────────────────────────────────────
const ENEMY_COLORS = [0xff2244, 0x44aaff, 0x44ff88, 0xff44ff];
const ENEMY_DOWN_DIRS = [DIRS.ll, DIRS.lr];

function spawnEnemy() {
  const colorIdx = enemies.length % ENEMY_COLORS.length;
  const geo = new THREE.SphereGeometry(0.38, 14, 10);
  const mat = new THREE.MeshLambertMaterial({ color: ENEMY_COLORS[colorIdx] });
  const mesh = new THREE.Mesh(geo, mat);

  // Mini eyes
  const eyeGeo = new THREE.SphereGeometry(0.09, 8, 8);
  const eMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  [-0.14, 0.14].forEach(ox => {
    const e = new THREE.Mesh(eyeGeo, eMat);
    e.position.set(ox, 0.18, 0.3);
    mesh.add(e);
  });

  const group = new THREE.Group();
  group.add(mesh);
  enemyGroup.add(group);

  // Start enemies off-screen above the top tile, with a grace period before collision
  const sc = 0, sr = 0;
  const wp = gridToWorld(sc, sr);
  group.position.set(wp.x, wp.y + CUBE_H * 0.5 + 3.5, wp.z); // start above

  const spawnedAt = Date.now();
  enemies.push({
    group, col: sc, row: sr,
    hopPhase: null,
    nextHopAt: spawnedAt + 1200 + Math.random() * 600,
    alive: true,
    bounceDir: ENEMY_DOWN_DIRS[Math.floor(Math.random() * 2)],
    graceUntil: spawnedAt + 2000, // no collision for first 2s
  });

  // Animate drop-in
  const startY = wp.y + CUBE_H * 0.5 + 3.5;
  const endY   = wp.y + CUBE_H * 0.5 + 0.38;
  const dropStart = Date.now();
  const dropDuration = 400;
  function dropAnim() {
    const t = Math.min((Date.now() - dropStart) / dropDuration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    group.position.y = startY + (endY - startY) * ease;
    if (t < 1) requestAnimationFrame(dropAnim);
  }
  requestAnimationFrame(dropAnim);
}

function updateEnemy(enemy, now) {
  if (!enemy.alive) return;

  if (enemy.hopPhase) {
    const elapsed = now - enemy.hopPhase.startTime;
    const t = Math.min(elapsed / ENEMY_HOP_MS, 1);
    const arc = HOP_HEIGHT * 0.65 * 4 * t * (1 - t);
    enemy.group.position.lerpVectors(enemy.hopPhase.fromV, enemy.hopPhase.toV, t);
    enemy.group.position.y += arc;
    const s = Math.sin(t * Math.PI);
    enemy.group.scale.set(1 - s * 0.1, 1 + s * 0.22, 1 - s * 0.1);

    if (t >= 1) {
      enemy.col = enemy.hopPhase.toCol;
      enemy.row = enemy.hopPhase.toRow;
      enemy.group.scale.set(1, 1, 1);
      enemy.hopPhase = null;
      enemy.nextHopAt = now + ENEMY_HOP_MS * 0.75 + Math.random() * 400;

      if (!isValid(enemy.col, enemy.row)) {
        // Fell off; reset to top
        enemy.col = 0; enemy.row = 0;
        const wp = gridToWorld(0, 0);
        enemy.group.position.set(wp.x, wp.y + CUBE_H * 0.5 + 0.38, wp.z);
        enemy.nextHopAt = now + 1000 + Math.random() * 1000;
        enemy.bounceDir = ENEMY_DOWN_DIRS[Math.floor(Math.random() * 2)];
      }
    }
    return;
  }

  if (now < enemy.nextHopAt) return;

  const [dc, dr] = enemy.bounceDir;
  let nc = enemy.col + dc, nr = enemy.row + dr;

  if (!isValid(nc, nr)) {
    // Try other direction
    const other = ENEMY_DOWN_DIRS.find(d => d !== enemy.bounceDir) || ENEMY_DOWN_DIRS[0];
    nc = enemy.col + other[0];
    nr = enemy.row + other[1];
    enemy.bounceDir = other;
  }

  const fromV = enemy.group.position.clone();
  const toWP = gridToWorld(nc, nr);
  const baseY = isValid(nc, nr) ? toWP.y + CUBE_H * 0.5 + 0.38 : toWP.y + CUBE_H * 0.5 + 0.38;
  const toV = new THREE.Vector3(toWP.x, baseY, toWP.z);

  enemy.hopPhase = { fromV, toV, startTime: now, toCol: nc, toRow: nr };
}

// ─── Swear Bubble ────────────────────────────────────────────────────────────
function worldToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
}

function showSwear() {
  const el = document.getElementById('swear');
  const wp = qbertGroup.position.clone();
  wp.y += 1.8;
  const sc = worldToScreen(wp);
  el.style.left = (sc.x - 44) + 'px';
  el.style.top  = (sc.y - 32) + 'px';
  el.style.display = 'block';
}

// ─── Death ───────────────────────────────────────────────────────────────────
function triggerDeath() {
  if (dying) return;
  dying = true;
  lives--;
  updateHUD();
  showSwear();
  if (qbertBody) qbertBody.material.color.set(0xff2222);

  setTimeout(() => {
    document.getElementById('swear').style.display = 'none';
    if (lives <= 0) {
      gameOver();
    } else {
      qCol = 0; qRow = 0;
      setQbertAtTile(0, 0);
      hopPhase = null;
      qbertGraceUntil = Date.now() + 1500; // 1.5s invincibility after respawn
      if (qbertBody) qbertBody.material.color.set(0xff8800);
      dying = false;
    }
  }, 1300);
}

// ─── Level Complete / Game Over ───────────────────────────────────────────────
function levelComplete() {
  gameActive = false;
  score += 500 + level * 150;
  updateHUD();
  setTimeout(() => {
    level++;
    dying = false;
    gameActive = true;
    startLevel();
  }, 1400);
}

function gameOver() {
  gameActive = false;
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = 'GAME OVER';
  ov.querySelector('.sub').innerHTML = `FINAL SCORE: ${score}<br><br>BETTER LUCK NEXT TIME`;
  ov.querySelector('.btn').textContent = 'PLAY AGAIN';
  ov.classList.remove('hidden');
}

// ─── Light Cube ───────────────────────────────────────────────────────────────
function lightCube(col, row) {
  const key = `${col},${row}`;
  const cube = cubeMap.get(key);
  if (!cube || cube.danger || cube.lit) return false;
  cube.lit = true;
  // Swap to lit materials (clone for independence)
  cube.mesh.material = currentLitMats.map(m => m.clone());
  litCount++;
  return true;
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-level').textContent = level + 1;
  const el = document.getElementById('lives-icons');
  el.innerHTML = '';
  for (let i = 0; i < Math.max(0, lives); i++) {
    const d = document.createElement('div');
    d.className = 'life-dot';
    el.appendChild(d);
  }
}

// ─── Level Start ─────────────────────────────────────────────────────────────
function startLevel() {
  const palIdx = level % PALS.length;
  const dangerTarget = Math.min(2 + level, 9);

  buildPyramid(palIdx);
  placeDanger(dangerTarget);

  totalNonDanger = 0; litCount = 0;
  for (const [, cube] of cubeMap) {
    if (!cube.danger) totalNonDanger++;
  }

  enemyGroup.clear();
  enemies = [];
  const numEnemies = Math.min(1 + Math.floor(level / 2), 4);
  for (let i = 0; i < numEnemies; i++) {
    setTimeout(() => { if (gameActive) spawnEnemy(); }, i * 1400 + 600);
  }

  buildQbert();
  qCol = 0; qRow = 0;
  setQbertAtTile(0, 0);
  hopPhase = null; squashT = 1;
  qbertGraceUntil = Date.now() + 2000; // 2s grace at level start

  lightCube(0, 0);
  updateHUD();
}

// ─── Input ───────────────────────────────────────────────────────────────────
// Arrow keys map to Q*bert diagonals (45° rotation):
//   Left=up-left, Up=up-right, Right=down-right, Down=down-left
// WASD mirrors the same layout: A=ul, W=ur, D=lr, S=ll
const KEY_TO_DIR = {
  ArrowLeft:  'ul', KeyA: 'ul', KeyQ: 'ul',
  ArrowUp:    'ur', KeyW: 'ur', KeyE: 'ur',
  ArrowRight: 'lr', KeyD: 'lr',
  ArrowDown:  'll', KeyS: 'll',
};

window.addEventListener('keydown', e => {
  if (!gameActive || dying) return;
  const dir = KEY_TO_DIR[e.code];
  if (!dir) return;
  e.preventDefault();
  if (hopPhase) return;

  const [dc, dr] = DIRS[dir];
  if (qbertNoseGroup) qbertNoseGroup.rotation.y = DIR_ROT[dir];

  const nc = qCol + dc, nr = qRow + dr;

  if (!isValid(nc, nr)) {
    triggerDeath();
    return;
  }

  const fromWP = gridToWorld(qCol, qRow);
  const toWP   = gridToWorld(nc, nr);
  const fromV  = new THREE.Vector3(fromWP.x, fromWP.y + CUBE_H * 0.5, fromWP.z);
  const toV    = new THREE.Vector3(toWP.x,   toWP.y   + CUBE_H * 0.5, toWP.z);
  const destCube = cubeMap.get(`${nc},${nr}`);

  hopPhase = {
    fromV, toV,
    startTime: performance.now(),
    duration: HOP_DURATION,
    toCol: nc, toRow: nr,
    danger: !!(destCube && destCube.danger),
  };
});

// ─── Animate ─────────────────────────────────────────────────────────────────
function animate(now) {
  requestAnimationFrame(animate);

  if (!gameActive) {
    renderer.render(scene, camera);
    return;
  }

  const dt = 16; // approximate frame time for clock
  dangerClock += 0.018;

  // Pulse danger tile top face emissive
  const pulse = 0.5 + 0.5 * Math.sin(dangerClock * 3.5);
  if (dangerMats[2] && dangerMats[2].emissive) {
    dangerMats[2].emissive.lerpColors(
      new THREE.Color(0x330000),
      new THREE.Color(0xff2200),
      pulse
    );
  }

  // Q*bert hop animation
  if (hopPhase && !dying) {
    const elapsed = now - hopPhase.startTime;
    const t = Math.min(elapsed / hopPhase.duration, 1);
    const arc = HOP_HEIGHT * 4 * t * (1 - t);

    qbertGroup.position.lerpVectors(hopPhase.fromV, hopPhase.toV, t);
    qbertGroup.position.y += arc;

    const s = Math.sin(t * Math.PI);
    qbertGroup.scale.set(1 - s * 0.12, 1 + s * 0.3, 1 - s * 0.12);

    if (t >= 1) {
      qCol = hopPhase.toCol;
      qRow = hopPhase.toRow;
      const landed = hopPhase;
      hopPhase = null;

      if (landed.danger) {
        qbertGroup.scale.set(1, 1, 1);
        triggerDeath();
      } else {
        squashT = 0.82; // landing squash
        lightCube(qCol, qRow);
        score += 25;
        updateHUD();
        if (litCount >= totalNonDanger) levelComplete();
      }
    }
  }

  // Squash decay on landing
  if (!hopPhase && squashT < 1) {
    squashT = Math.min(1, squashT + 0.07);
    if (qbertGroup && !dying) {
      qbertGroup.scale.set(2 - squashT, squashT, 2 - squashT);
    }
  }

  // Enemies
  for (const e of enemies) {
    updateEnemy(e, now);
    // Collision with Q*bert (skip if either has grace period)
    if (!dying && !hopPhase
        && now > qbertGraceUntil
        && now > (e.graceUntil || 0)
        && e.col === qCol && e.row === qRow) {
      triggerDeath();
    }
  }

  renderer.render(scene, camera);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  score = 0; lives = 3; level = 0; dying = false;
  document.getElementById('overlay').classList.add('hidden');
  gameActive = true;
  startLevel();
});

animate(0);
</script>
</body>
